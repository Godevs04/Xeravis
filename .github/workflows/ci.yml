name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --no-deprecation --max-old-space-size=6144
  NEXT_TELEMETRY_DISABLED: '1'
  # Placeholder config: the build and audits run against an empty local MongoDB, so pages
  # render their fallback content and no production data or secrets are needed.
  DATABASE_URI: mongodb://127.0.0.1:27017/xelarvis-ci
  PAYLOAD_SECRET: ci-placeholder-secret-not-used-in-production
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  checks:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build-audit:
    name: Build, Lighthouse CI and axe
    runs-on: ubuntu-latest
    needs: checks
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Start server
        run: |
          npm run start > server.log 2>&1 &
          npx --yes wait-on@8 --timeout 120000 http://localhost:3000/
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15 autorun
      - name: axe accessibility scan
        run: >
          npx --yes @axe-core/cli@4
          http://localhost:3000/
          http://localhost:3000/services
          http://localhost:3000/careers
          http://localhost:3000/contact
          http://localhost:3000/ai-readiness
          --chromedriver-path "$CHROMEWEBDRIVER/chromedriver"
          --exit
      - name: Server log
        if: failure()
        run: tail -n 200 server.log
